[project]
name = "vcl"
version = "0.1.0"
description = "Virtual Climate Lab: an interactive table to discuss the future of your environment."
readme = "README.rst"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
    { name = "Guus van Hemert", email = "guus.vanhemert@deltares.nl" }
]
keywords = ["vcl"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8"
]
dependencies = [
    "click>=8.3.1",
    "cmocean>=4.0.3",
    "geopandas>=1.1.2",
    "matplotlib>=3.10.8",
    "mediapipe==0.10.32",
    "mido>=1.3.3",
    "netcdf4>=1.7.3",
    "opencv-python-headless>=4.13.0.90",
    "pygame>=2.6.1",
    "pygetwindow>=0.0.9",
    "pywinctl>=0.4.1",
    "scipy>=1.15.3",
    "screeninfo>=0.8.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "zmq>=0.0.0",
    "rasterio==1.4.3",
    "pyproj==3.6.1",
    "rioxarray==0.15.0",
    "zarr>=3.0.1",
    "rtmidi>=2.5.0",
    "python-rtmidi>=1.5.8",
]

[project.optional-dependencies]
test = ["pytest>=3"]

[project.urls]
Homepage = "https://github.com/openearth/vcl"

[project.scripts]
vcl = "vcl.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vcl", "vcl.*"]
